# Site identity. Theme: hand-written, no gem; shared with digital-doug (see DESIGN.md).
title                     : "Darkling Whim"
subtitle                  : "Untethered tales, beautifully scarred"
name                      : "Doug Langille"
description               : "Stories and poems by Doug Langille: dark around the edges, wonder with teeth."
baseurl                   : ""
url                       : "https://douglangille.ca"
repository                : "douglangille/darkling-whim"
email                     : "me@douglangille.ca"
locale                    : "en-CA"
timezone                  : "America/Halifax"
og_image                  : "/assets/images/og-darkling-whim.png"
words_per_minute          : 200
goatcounter               : "darklingwhim"
colophon                  : "Set in Libron, Special Elite and JetBrains Mono."
theme_colors              : { light: "#faf4ed", dark: "#191724" }
preload_fonts             : ["Libron-Regular", "Libron-Bold", "SpecialElite"]
band_title                : "A new story most weeks"
band_text                 : "Except when I don't. Just the story, no algorithm."
newsletter_url            : "https://darklingwhim.substack.com/"

author:
  name: "Doug Langille"
  avatar: "/assets/images/bio-photo.png"
  bio: "hack writer & shameless technophile"
  links:
    - { label: "Nova Scotia", url: "https://en.wikipedia.org/wiki/Nova_Scotia" }
    - { label: "Digital Doug", url: "https://digital.douglangille.ca" }
    - { label: "Amazon", url: "https://www.amazon.com/author/douglangille" }
    - { label: "Email", url: "mailto:me@douglangille.ca" }

footer:
  since                   : "2013"
  links:
    - { label: "About", url: "/about/" }
    - { label: "Digital Doug", url: "https://digital.douglangille.ca" }
    - { label: "Amazon", url: "https://www.amazon.com/author/douglangille" }
    - { label: "LinkedIn", url: "https://www.linkedin.com/in/douglangille/" }
    - { label: "RSS", url: "/feed.xml" }

markdown                  : kramdown
highlighter               : rouge
permalink                 : /:title/
excerpt_separator         : "\n\n"
incremental               : false
encoding                  : "utf-8"

include:
  - .htaccess
  - _pages
exclude:
  # Writing Studio / Private PARA Folders
  - /__inbox
  - /_books
  - /_digital_doug
  - /_farm
  - /_life
  - /_plan
  - /_tech
  - /_work
  - /_writing
  - /_drafts
  - /story-engine
  # Build & Environment
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "*.sublime-project"
  - "*.sublime-workspace"
  - /docs
  - /test

# -----------------------------------------------------------------------------
# Plugins & Pagination
# -----------------------------------------------------------------------------

sass:
  style                   : compressed

plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-gist

jekyll-archives:
  enabled                 : [tags]
  layouts:
    tag                   : tag
  permalinks:
    tag                   : /tag/:name/

# Tags are filter groups on /writings/ (world, theme, mood, form). haley and revised are
# curation tags with their own pages, not filters.
tag_groups:
  - label: World
    tags: [grounded, speculative]
  - label: Theme
    tags: [solitude, kith-kin, intimacy]
  - label: Mood
    tags: [wit, melancholy, tension, eerie, dark]
  - label: Form
    tags: [poetry]

defaults:
  - scope: { path: "assets" }
    values: { sitemap: false }
  - scope: { path: "" }
    values: { layout: "page" }
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

# Curation tags that have their own pages instead of a filter chip.
tag_redirects:
  revised: /recently-revised/
  haley: /haleys-war/
