---
layout: default
---
<div class="wrap">
  <header class="page-head"><h1>#{{ page.title }}</h1><p>{{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %}. <a href="{{ '/writings/' | relative_url }}">All stories and poems</a></p></header>
  <ul class="rows">{% for post in page.posts %}<li>{% include card.html post=post row=true %}</li>{% endfor %}</ul>
</div>
